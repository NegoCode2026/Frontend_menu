services:
  # Produccion: build Angular 22 + Nginx (usa tu Dockerfile multi-stage)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: /api
        APP_BASE_URL: http://localhost:4200
        BACKEND_ORIGIN: http://host.docker.internal:8080
    environment:
      # Origen del backend Spring Boot. Para backend local usa
      # http://host.docker.internal:8080, para otro contenedor en la
      # misma red usa http://backend:8080
      BACKEND_ORIGIN: http://host.docker.internal:8080
      PORT: 80
    ports:
      - "4200:80"
    restart: unless-stopped

  # Desarrollo: ng serve con hot-reload (http://localhost:3000)
  # Uso: docker compose --profile dev up frontend-dev
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    profiles: ["dev"]
